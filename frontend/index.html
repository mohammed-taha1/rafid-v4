<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b5f5a" />
    <meta name="description" content="رافد — قارن بحثك بشروط فرصة تمويل محددة واحصل على قراءة منظمة للأهلية والأدلة والفجوات." />
    <title>رافد | ملاءمة البحث للتمويل</title>
    <script>
      (() => {
        const language = localStorage.getItem("rafid-language") === "en" ? "en" : "ar";
        document.documentElement.lang = language;
        document.documentElement.dir = language === "en" ? "ltr" : "rtl";
        document.documentElement.dataset.language = language;
      })();
    </script>
    <link rel="preload" as="image" href="assets/rafid-logo.png" fetchpriority="high" />
    <link rel="stylesheet" href="rafid-v4.css" />
    <script defer src="vendor/mammoth.browser.min.js"></script>
    <script defer src="rafid-config.js"></script>
    <script defer src="rafid-i18n.js"></script>
    <script defer src="rafid-ingest.js"></script>
    <script defer src="opportunity-match.js"></script>
    <script defer src="demo-data.js"></script>
    <script defer src="education-content.js"></script>
    <script defer src="education-content-en.js"></script>
    <script defer src="rafid-brand.js"></script>
    <script defer src="advanced-services.js"></script>
    <script defer src="institution-workspace.js"></script>
    <script defer src="research-ui.js"></script>
    <script defer src="education-pages.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#rafidApp">انتقل إلى المحتوى</a>
    <main id="rafidApp" class="rafid rafid-boot" aria-busy="true">
      <header class="rafid-header">
        <span class="rafid-logo" aria-label="رافد">
          <span class="brand-logo-crop"><img src="assets/rafid-logo.png" alt="" width="1254" height="1254" /></span>
          <b class="sr-only">رافد</b>
        </span>
      </header>
      <section class="boot-card" aria-live="polite">
        <span class="rafid-kicker"><span class="boot-ar">منصة رافد</span><span class="boot-en" lang="en">Rafid platform</span></span>
        <h1><span class="boot-ar">قرار أوضح لبحثك قبل التقديم</span><span class="boot-en" lang="en">A clearer decision for your research before you apply</span></h1>
        <p><span class="boot-ar">نجهز مساحة العمل الآمنة…</span><span class="boot-en" lang="en">Preparing your secure workspace…</span></p>
        <i aria-hidden="true"></i>
      </section>
      <noscript><p class="rafid-notice">يحتاج رافد إلى JavaScript لتشغيل تحليل المستندات.</p></noscript>
    </main>
  </body>
</html>
