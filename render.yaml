services:
  - type: web
    name: rafid-mvp
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: RAFID_HOST
        value: 0.0.0.0
      - key: APP_URL
        value: https://rafid.rafid-platform.workers.dev
      - key: RAFID_DEPLOYMENT_MODE
        value: shared
      - key: RAFID_PROVIDER_CONFIGURATION_MODE
        value: server
      - key: RAFID_AUTH_REQUIRED
        value: false
      - key: RAFID_ALLOWED_ORIGINS
        value: https://rafid.rafid-platform.workers.dev,https://rafid-v4.onrender.com
      - key: MAX_FILE_SIZE_MB
        value: 20
      - key: MAX_ANALYSIS_INPUT_CHARS
        value: 16000
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: 120
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_ASSESSMENT_REASONING_EFFORT
        value: medium
      # مسار OpenAI الهجين جاهز لكنه لا يصبح فعالًا إلا بعد تغيير AI_PROVIDER
      # وإدخال OPENAI_API_KEY وتأكيد ZDR يدويًا في مدير أسرار Render.
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_EXTRACTION_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_OPPORTUNITY_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_ASSESSMENT_MODEL
        value: gpt-5.6-sol
